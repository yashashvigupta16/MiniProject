<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="AlgoMind: resume-to-role semantic alignment engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0E2A"/><stop offset="1" stop-color="#0D1236"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6C4BFF"/><stop offset="1" stop-color="#2F7BFF"/></linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C9BEFF"/><stop offset="1" stop-color="#7FB0FF"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#6C4BFF" stop-opacity=".55"/><stop offset="1" stop-color="#6C4BFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#2F7BFF" stop-opacity=".4"/><stop offset="1" stop-color="#2F7BFF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
    <clipPath id="frame"><rect width="1280" height="440" rx="24"/></clipPath>
    <clipPath id="paper"><rect x="872" y="72" width="240" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    .serif{font-family:'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif}
    .sans{font-family:'Plus Jakarta Sans','Segoe UI',Inter,system-ui,sans-serif}
    .float{animation:float 6s ease-in-out infinite}
    .d2{animation-delay:-2s}.d4{animation-delay:-4s}
    .beam{animation:scan 3.6s ease-in-out infinite alternate}
    .ring{animation:ring 2.2s cubic-bezier(.2,.7,.2,1) both}
    .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.8s cubic-bezier(.2,.7,.2,1) both}
    .pulse{animation:pulse 5s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-9px)}}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(270px)}}
    @keyframes ring{from{stroke-dashoffset:176}}
    @keyframes grow{from{transform:scaleX(0)}}
    @keyframes pulse{50%{opacity:.6}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <circle class="pulse" cx="1070" cy="20" r="380" fill="url(#g1)"/>
    <circle class="pulse d2" cx="60" cy="450" r="340" fill="url(#g2)"/>

    <!-- brand -->
    <rect x="76" y="62" width="52" height="52" rx="15" fill="url(#brand)"/>
    <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M91 101 102 76l11 25M96 92h12"/></g>
    <circle cx="102" cy="76" r="3.4" fill="#fff"/>
    <text x="144" y="98" class="sans" font-size="29" font-weight="800" fill="#fff" letter-spacing="-.6">AlgoMind</text>

    <text class="serif" font-size="54" fill="#fff" letter-spacing="-1">
      <tspan x="74" y="200">See which roles your resume</tspan>
      <tspan x="74" y="270" fill="url(#soft)" font-style="italic">truly speaks to.</tspan>
    </text>
    <text x="77" y="320" class="sans" font-size="18" fill="#fff" fill-opacity=".68">Autonomous Resume-to-Role Semantic Alignment &amp; Ranking Engine</text>

    <g class="sans" font-size="13.5" font-weight="600" fill="#fff">
      <g fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".18"><rect x="76" y="346" width="92" height="34" rx="17"/><rect x="180" y="346" width="84" height="34" rx="17"/><rect x="276" y="346" width="112" height="34" rx="17"/><rect x="400" y="346" width="84" height="34" rx="17"/></g>
      <g text-anchor="middle"><text x="122" y="368">SBERT</text><text x="222" y="368">FAISS</text><text x="332" y="368">Gemini AI</text><text x="442" y="368">Flask</text></g>
    </g>

    <!-- resume card -->
    <rect x="896" y="92" width="240" height="300" rx="16" fill="url(#brand)" opacity=".45"/>
    <rect x="872" y="72" width="240" height="300" rx="16" fill="#fff"/>
    <circle cx="908" cy="110" r="18" fill="url(#brand)"/>
    <rect x="936" y="99" width="112" height="9" rx="4.5" fill="#0A0E2A"/><rect x="936" y="115" width="78" height="7" rx="3.5" fill="#C9BEFF"/>
    <g fill="#E0DBFF"><rect x="894" y="150" width="192" height="8" rx="4"/><rect x="894" y="168" width="160" height="8" rx="4" fill="#9DB9FF"/><rect x="894" y="186" width="178" height="8" rx="4"/></g>
    <g fill="url(#brand)"><rect x="894" y="214" width="58" height="22" rx="11"/><rect x="960" y="214" width="44" height="22" rx="11"/><rect x="894" y="244" width="72" height="22" rx="11"/></g>
    <g fill="#EFEBFF"><rect x="1012" y="214" width="64" height="22" rx="11"/><rect x="974" y="244" width="52" height="22" rx="11"/></g>
    <g fill="#E0DBFF"><rect x="894" y="290" width="170" height="8" rx="4"/><rect x="894" y="308" width="136" height="8" rx="4" fill="#9DB9FF"/><rect x="894" y="326" width="186" height="8" rx="4"/><rect x="894" y="344" width="104" height="8" rx="4"/></g>
    <g clip-path="url(#paper)"><g class="beam"><rect x="872" y="46" width="240" height="40" fill="url(#brand)" opacity=".13"/><rect x="872" y="86" width="240" height="2" fill="#6C4BFF"/></g></g>

    <!-- score card -->
    <g class="float">
      <rect x="1012" y="34" width="220" height="92" rx="18" fill="#111741" fill-opacity=".93" stroke="#fff" stroke-opacity=".18"/>
      <circle cx="1056" cy="80" r="28" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="7"/>
      <circle class="ring" cx="1056" cy="80" r="28" fill="none" stroke="url(#soft)" stroke-width="7" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="23" transform="rotate(-90 1056 80)"/>
      <text x="1056" y="85" class="sans" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">87%</text>
      <text x="1096" y="72" class="sans" font-size="11" fill="#fff" fill-opacity=".6">Top match</text>
      <text class="sans" font-size="13.5" font-weight="700" fill="#fff"><tspan x="1096" y="90">ML Engineer</tspan></text>
    </g>

    <!-- matched skills -->
    <g class="float d2">
      <rect x="770" y="272" width="196" height="88" rx="16" fill="#F8F7FF"/>
      <text x="786" y="297" class="sans" font-size="11" font-weight="700" fill="#5B6288">Matched skills</text>
      <g fill="url(#brand)"><rect x="786" y="310" width="66" height="26" rx="13"/><rect x="860" y="310" width="82" height="26" rx="13"/></g>
      <g class="sans" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle"><text x="819" y="327">Python</text><text x="901" y="327">Pandas</text></g>
    </g>

    <!-- skill gap -->
    <g class="float d4">
      <rect x="1036" y="300" width="204" height="76" rx="16" fill="#F8F7FF" stroke="#C9BEFF"/>
      <text x="1052" y="328" class="sans" font-size="12.5" font-weight="700" fill="#0A0E2A">Docker</text>
      <text x="1224" y="328" class="sans" font-size="11" fill="#5B6288" text-anchor="end">gap to close</text>
      <rect x="1052" y="346" width="172" height="8" rx="4" fill="#E0DBFF"/>
      <rect class="bar" x="1052" y="346" width="56" height="8" rx="4" fill="url(#brand)"/>
      <rect x="1172" y="339" width="3" height="22" rx="1.5" fill="#B45F06"/>
    </g>
  </g>
</svg>
